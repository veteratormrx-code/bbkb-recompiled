plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'dev.bbkb.ime.harness'
    compileSdk = 36
    defaultConfig {
        applicationId = 'dev.bbkb.ime.harness'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    // The benchmark drives the corpus that lives with the QA documents; copy it in rather than
    // keeping a second copy that can drift.
    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/assets"
    }
}

tasks.register('copyAutocorrectCorpus', Copy) {
    from rootProject.file('docs/qa/autocorrect-corpus.csv')
    into "$buildDir/generated/assets"
}

tasks.named('preBuild') { dependsOn 'copyAutocorrectCorpus' }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
